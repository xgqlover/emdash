name: Release (Production)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    outputs:
      release_id: ${{ steps.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # [XG-CUSTOM 2026-10-09] **建新草稿前先清旧草稿**（否则占用永久增长 ⇒ 会把 Actions 顶停）
      # 根因：`finalize-release` 需要 4 个 job 全绿，而 `release-mac` 在本 fork 恒失败 ⇒
      #       "Publish GitHub release draft" 永远不跑 ⇒ 每个版本 ~1 GB 的草稿永久留在仓里。
      #       2026-10-09 实测堆积 **23 个 / 24.8 GB**，触发 GitHub
      #       「Workflows aren't being run on this fork because of its GitHub Actions usage」
      #       把本仓 Actions 停掉（`gh workflow run` 恒 422，只能网页 re-enable）。
      # 策略：**保留最近 KEEP 个草稿**（含本次要用的那个），其余删掉；**不删 tag**
      #       （版本号每次 bump ⇒ tag 不会冲突，留着便于追溯）。
      # 安全：`continue-on-error` + 每条删除都兜底 ⇒ **清理失败绝不影响发版**。
      - name: Prune old draft releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: apps/emdash-desktop
        run: |
          set -uo pipefail
          KEEP=2
          CUR="v$(node -p "require('./package.json').version")"
          echo "本次 tag：$CUR（保留最近 $KEEP 个草稿，含本次）"
          kept=0
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            if [ "$tag" = "$CUR" ]; then echo "  ↷ 保留（本次）$tag"; continue; fi
            if [ "$kept" -lt "$((KEEP - 1))" ]; then echo "  ↳ 保留（回退用）$tag"; kept=$((kept + 1)); continue; fi
            echo "  🗑 删除旧草稿 $tag"
            gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" || echo "     （删除失败，忽略）"
          done < <(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                     --jq '.[] | select(.draft) | [.created_at, .tag_name] | @tsv' \
                   | sort -r | cut -f2)
          echo "清理完成，剩余草稿："
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft) | "  · \(.tag_name)  \(([.assets[].size] | add // 0) / 1048576 | floor) MB"'

      - name: Create or reuse draft release
        id: prepare
        working-directory: apps/emdash-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: node --experimental-strip-types scripts/release/prepare-release.ts

  release-linux:
    needs: [prepare-release]
    uses: ./.github/workflows/release-linux.yml
    permissions:
      contents: write
    with:
      channel: stable
      release_id: ${{ needs.prepare-release.outputs.release_id }}
    secrets:
      POSTHOG_PROJECT_API_KEY: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
      POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}

  release-win:
    needs: [prepare-release]
    runs-on: windows-2022
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          posthog-key: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
          posthog-host: ${{ secrets.POSTHOG_HOST }}
          windows-native: 'true'
      - name: Export Python path for native modules
        shell: bash
        run: echo "python=$(which python)" >> "$GITHUB_ENV"

      - name: Build app
        shell: bash
        run: pnpm run build

      - shell: bash
        run: echo "NODE_OPTIONS=${NODE_OPTIONS:-not set}" && node --version

      - name: Require Azure Trusted Signing secrets
        shell: bash
        env:
          AZ_TENANT: ${{ secrets.AZURE_TENANT_ID }}
          AZ_CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          AZ_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if [ -n "$AZ_TENANT" ] && [ -n "$AZ_CLIENT" ] && [ -n "$AZ_SECRET" ]; then
            echo "Azure Trusted Signing is configured."
          else
            echo "::warning::Azure Trusted Signing secrets missing, building unsigned (fork)."
          fi

      - name: Build Windows packages
        shell: bash
        working-directory: apps/emdash-desktop
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.github/electron-builder-cache
          ELECTRON_BUILDER_ICONS_TOOLSET_DIR: ${{ github.workspace }}/.github/electron-builder-bin/icons/icons-bundle
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          node --experimental-strip-types scripts/release/build.ts
          --platform win --arch x64
          --release-id "${{ needs.prepare-release.outputs.release_id }}"

      - name: Verify Windows code signature
        shell: bash
        working-directory: apps/emdash-desktop
        run: echo "Skipping code signature verification (unsigned fork build)."

      - name: Upload verified Windows assets to owned draft
        shell: bash
        working-directory: apps/emdash-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          node --experimental-strip-types scripts/release/upload-github-assets.ts
          --platform win --release-id "${{ needs.prepare-release.outputs.release_id }}"

  release-mac:
    needs: [prepare-release]
    runs-on: macos-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          posthog-key: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
          posthog-host: ${{ secrets.POSTHOG_HOST }}

      - name: Import Apple signing certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_P12 }}
          p12-password: ${{ secrets.CERTIFICATE_PASSWORD }}

      - run: pnpm run build

      - run: echo "NODE_OPTIONS=${NODE_OPTIONS:-not set}" && node --version

      - name: Build signed DMGs + ZIPs
        working-directory: apps/emdash-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          node --experimental-strip-types scripts/release/build.ts
          --platform mac --arch both --targets dmg,zip
          --release-id "${{ needs.prepare-release.outputs.release_id }}"

      - name: Notarize and staple
        working-directory: apps/emdash-desktop
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node --experimental-strip-types scripts/release/notarize-mac.ts --app-bundle "Emdash.app"

      - name: Upload notarized macOS assets to owned draft
        working-directory: apps/emdash-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          node --experimental-strip-types scripts/release/upload-github-assets.ts
          --platform mac --release-id "${{ needs.prepare-release.outputs.release_id }}"

  finalize-release:
    needs: [prepare-release, release-linux, release-win, release-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish GitHub release draft
        working-directory: apps/emdash-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: >
          node --experimental-strip-types scripts/release/finalize-release.ts
          --release-id "${{ needs.prepare-release.outputs.release_id }}"
